name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cla:
    runs-on: ubuntu-latest

    steps:
      - name: Verify CLA acceptance in PR body
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Not a pull_request event, skipping CLA verification."
            exit 0
          fi

          AGREEMENT='- [x] I have read and agree to the Eos MCP Individual Contributor License Agreement v1.0.'
          if ! printf '%s\n' "${PR_BODY}" | grep -Fqi -- "${AGREEMENT}"; then
            echo "CLA v1.0 has not been accepted. Check the CLA box in the pull request template."
            exit 1
          fi

          echo "CLA v1.0 acceptance found in pull request body."

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Prepare log directory
        run: mkdir -p artifacts

      - name: Install dependencies
        run: npm ci 2>&1 | tee artifacts/npm-ci.log
        shell: bash

      - name: Verify SPDX license headers
        run: npm run license:check 2>&1 | tee artifacts/license-check.log
        shell: bash

      - name: Run lint
        run: npm run lint 2>&1 | tee artifacts/lint.log
        shell: bash

      - name: Run unit tests (mock)
        run: npm run test:unit 2>&1 | tee artifacts/test-unit.log
        shell: bash

      - name: Run conformance tests (real OSC)
        run: npm run test:conformance 2>&1 | tee artifacts/test-conformance.log
        shell: bash

      - name: Build project
        run: npm run build 2>&1 | tee artifacts/build.log
        shell: bash

      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: artifacts

  docs:
    runs-on: ubuntu-latest
    needs: [cla, build]
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated documentation
        run: npm run docs:check 2>&1 | tee docs-check.log
        shell: bash

      - name: Upload docs check logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-logs
          path: docs-check.log
