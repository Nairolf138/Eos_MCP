name: Normalize SPDX headers (product readiness)

on:
  push:
    branches: [chore/product-readiness]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/product-readiness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize project SPDX headers
        run: npm run license:fix

      - name: Verify normalized headers
        run: npm run license:check

      - name: Commit normalized headers
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SPDX header changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: normalize SPDX headers to AGPL-3.0-only"
          git push origin HEAD:chore/product-readiness
